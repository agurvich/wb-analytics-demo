[project]
name = "wb-analytics"
version = "0.1.0"
description = "Internal analytics utilities for WB poverty, inequality, and indicator pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Gurvich", email = "alex.b.gurvich@gmail.com" }]
dependencies = [
    "tomli>=2.0.2",
    "pluggy>=1.4.0",
    "packaging>=23.2",
    "click>=8.1.7",
    "pytest-cov>=4.1.1",
    "openpyxl>=3.1.2",
    "certifi>=2023.11.17",
    "urllib3>=2.1.0",
    "ruff>=0.2.0",
    "pytest>=7.4.3",
    "rich>=13.7.0",
    "numpy>=2.0.0",
    "pandas==1.5.3",
    "requests>=2.32.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "pre-commit>=3.5",
]

[project.scripts]
wb-analytics = "wb_analytics.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly: ruff is unpinned in the dependencies, and newer ruff
# releases widen the default rule set, which turned CI red on its own.
select = ["E4", "E7", "E9", "F"]
