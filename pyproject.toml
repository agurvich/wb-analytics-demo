[project]
name = "wb-analytics"
version = "0.1.0"
description = "Internal analytics utilities for WB poverty, inequality, and indicator pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Gurvich", email = "alex.b.gurvich@gmail.com" }]
dependencies = [
    "rich>=13.7.0",
    "click>=8.1.7",
    "jinja2>=3.1.3",
    "sqlalchemy>=2.0.25",
    "tomli>=2.0.2",
    "pluggy>=1.4.0",
    "packaging>=23.2",
    "pytest-cov>=4.1.1",
    "openpyxl>=3.1.2",
    "certifi>=2023.11.17",
    "urllib3>=2.1.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.1",
    "ruff>=0.2.0",
    "pytest>=7.4.3",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pandas==2.1.0",
    "requests==2.31.0",
    "pyyaml==6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1",
    "pre-commit>=3.5",
]

[project.scripts]
wb-analytics = "wb_analytics.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
